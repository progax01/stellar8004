[package]
name = "reputation-registry"
version = "0.1.0"
edition = "2021"
publish = false
description = "ERC-8004 Reputation Registry for Soroban - Feedback and reputation tracking"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

