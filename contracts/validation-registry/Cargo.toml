[package]
name = "validation-registry"
version = "0.1.0"
edition = "2021"
publish = false
description = "ERC-8004 Validation Registry for Soroban - Agent validation request/response"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

