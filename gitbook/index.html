<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AgenticOcean Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AgenticOcean — AI agent infrastructure for Stellar DeFi">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <style>
    :root {
      --theme-color: #6366f1;
      --sidebar-background: #0f0f1a;
      --content-background: #13131f;
    }
    /* hide every form of docsify loading indicator */
    #nprogress,
    #nprogress .bar,
    #nprogress .peg,
    #nprogress .spinner,
    #nprogress .spinner-icon,
    .progress-bar,
    .app-nav .progress-bar,
    .docsify-progress-bar { display: none !important; opacity: 0 !important; }
    /* sidebar logo */
    .sidebar > h1 { padding: 0 !important; margin: 0 0 16px 0 !important; }
    .sidebar > h1 a { display: block !important; }
    .sidebar > h1 img {
      width: 140px;
      height: auto;
      display: block;
      margin: 16px auto 0;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: '<img src="logo.png" alt="AgenticOcean" />',
      loadSidebar: '_sidebar.md',
      loadNavbar: false,
      homepage: 'README.md',
      subMaxLevel: 2,
      // always use the root sidebar — prevents per-directory re-fetch and sidebar flicker
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md',
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search docs...',
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied',
      },
      pagination: {
        previousText: '← Previous',
        nextText: 'Next →',
        crossChapter: true,
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
